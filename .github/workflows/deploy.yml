name: Deploy to Opalstack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt a deployment during its backup or cutover.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check deployment safeguards
        run: npm run test:deployment
      - name: Restore deployment configuration
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "Missing repository secret ENV_FILE" >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$ENV_FILE" > .env
      - name: Validate deployment configuration
        run: node scripts/deploy.mjs --check-env
      - name: Build, back up, and deploy
        run: npm run deploy
      - name: Remove deployment configuration
        if: always()
        run: rm -f .env
